<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatWave</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background: #e9eef5;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 100vh;
            margin: 0 auto;
            background: white;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #2563eb;
            color: white;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            min-width: 42px;
            border-radius: 50%;
            background: white;
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .header h2 {
            margin: 0;
            font-size: 19px;
        }

        .online {
            font-size: 12px;
            margin-top: 2px;
        }

        .messages {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            background: #f7f9fc;
        }

        .message {
            width: fit-content;
            max-width: 80%;
            background: white;
            padding: 9px 12px;
            margin: 8px 0;
            border-radius: 13px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            word-wrap: break-word;
        }

        .name {
            font-size: 12px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 3px;
        }

        .text {
            font-size: 15px;
            color: #222;
        }

        .name-area,
        .input-area {
            padding: 10px;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 7px;
            background: white;
        }

        .name-area input,
        .input-area input {
            min-width: 0;
            flex: 1;
            padding: 11px 13px;
            border: 1px solid #ddd;
            border-radius: 22px;
            outline: none;
            font-size: 15px;
        }

        .name-area button,
        .input-area button {
            border: none;
            background: #2563eb;
            color: white;
            padding: 0 16px;
            border-radius: 22px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
        }

        .name-area button {
            background: #16a34a;
        }

        @media (max-width: 500px) {

            .chat-container {
                max-width: none;
                height: 100dvh;
            }

            .header {
                padding: 12px;
            }

            .messages {
                padding: 10px;
            }

            .message {
                max-width: 85%;
            }

            .input-area,
            .name-area {
                padding: 8px;
            }

            .input-area input,
            .name-area input {
                font-size: 16px;
            }

            .input-area button,
            .name-area button {
                padding: 0 14px;
            }
        }
    </style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        <div class="avatar">💬</div>

        <div>
            <h2>ChatWave</h2>
            <div class="online">🟢 Online</div>
        </div>
    </div>

    <div class="messages" id="messages">

        {% for msg in messages %}
        <div class="message">
            <div class="name">{{ msg.name }}</div>
            <div class="text">{{ msg.message }}</div>
        </div>
        {% endfor %}

    </div>

    {% if not session.get("name") %}

    <form class="name-area" action="/set-name" method="POST">

        <input
            type="text"
            name="name"
            placeholder="Enter your name"
            required
            autocomplete="off"
        >

        <button type="submit">Save</button>

    </form>

    {% else %}

    <form class="input-area" action="/send" method="POST">

        <input
            type="text"
            name="message"
            placeholder="Type a message..."
            required
            autocomplete="off"
        >

        <button type="submit">Send</button>

    </form>

    {% endif %}

</div>

<script>
    const messages = document.getElementById("messages");
    messages.scrollTop = messages.scrollHeight;
</script>

</body>
</html>
