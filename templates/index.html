<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Chat Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 50px auto;
            background: white;
            min-height: 500px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        .header {
            background: #2196f3;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
        }

        .name-area {
            padding: 30px;
            text-align: center;
        }

        .name-area input,
        .input-area input {
            width: 75%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            background: #2196f3;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1976d2;
        }

        .welcome {
            padding: 15px;
            text-align: center;
            background: #e3f2fd;
        }

        .messages {
            padding: 20px;
            min-height: 300px;
        }

        .message {
            background: #eeeeee;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        .message strong {
            color: #2196f3;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #ddd;
        }

        .input-area input {
            flex: 1;
            width: auto;
        }

        .clear {
            display: block;
            text-align: center;
            margin: 10px;
            color: red;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>💬 My Chat Website</h1>
    </div>


    {% if not name %}

        <form class="name-area" action="/set-name" method="POST">

            <h2>Enter Your Name</h2>

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >

            <br><br>

            <button type="submit">
                Save
            </button>

        </form>

    {% else %}

        <div class="welcome">
            <h2>Welcome, {{ name }}! 👋</h2>
        </div>


        <div class="messages">

            {% if messages %}

                {% for msg in messages %}

                    <div class="message">
                        <strong>{{ msg.name }}:</strong>
                        {{ msg.message }}
                    </div>

                {% endfor %}

            {% else %}

                <p style="text-align:center;">
                    No messages yet.
                </p>

            {% endif %}

        </div>


        <form class="input-area" action="/send" method="POST">

            <input
                type="text"
                name="message"
                placeholder="Type your message..."
                required
            >

            <button type="submit">
                Send
            </button>

        </form>


        <a class="clear" href="/clear">
            Clear Messages
        </a>

    {% endif %}

</div>

</body>
</html>
