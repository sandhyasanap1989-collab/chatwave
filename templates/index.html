<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatWave</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background: #e9eef5;
        }

        .chat-container {
            width: 450px;
            height: 90vh;
            margin: 5vh auto;
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #2563eb;
            color: white;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: white;
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .header h2 {
            margin: 0;
            font-size: 20px;
        }

        .online {
            font-size: 12px;
            margin-top: 3px;
            opacity: 0.9;
        }

        .messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #f7f9fc;
        }

        .message {
            width: fit-content;
            max-width: 80%;
            background: white;
            padding: 10px 14px;
            margin: 10px 0;
            border-radius: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            word-wrap: break-word;
        }

        .name {
            font-size: 12px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 4px;
        }

        .text {
            font-size: 15px;
            color: #222;
            white-space: pre-wrap;
        }

        .name-area,
        .input-area {
            padding: 10px;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 8px;
            background: white;
            flex-shrink: 0;
        }

        .name-area input,
        .input-area input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
            font-size: 15px;
        }

        .name-area button {
            border: none;
            background: #16a34a;
            color: white;
            padding: 0 16px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
        }

        .input-area button {
            border: none;
            background: #2563eb;
            color: white;
            padding: 0 18px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
        }

        @media (max-width: 500px) {
            .chat-container {
                width: 100%;
                height: 100dvh;
                margin: 0;
                border-radius: 0;
            }

            .header {
                padding: 14px;
            }

            .messages {
                padding: 10px;
            }

            .message {
                max-width: 85%;
            }
        }
    </style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        <div class="avatar">💬</div>

        <div>
            <h2>ChatWave</h2>
            <div class="online">🟢 Online</div>
        </div>
    </div>


    <div class="messages" id="messages">

        {% for msg in messages %}
        <div class="message">
            <div class="name">{{ msg.name }}</div>
            <div class="text">{{ msg.message }}</div>
        </div>
        {% endfor %}

    </div>


    {% if not session.get("name") %}

    <form class="name-area" action="/set-name" method="POST">

        <input
            type="text"
            name="name"
            placeholder="Enter your name"
            required
            autocomplete="name"
        >

        <button type="submit">Save</button>

    </form>

    {% else %}

    <form class="input-area" action="/send" method="POST">

        <input
            type="text"
            name="message"
            placeholder="Type a message..."
            required
            autocomplete="off"
        >

        <button type="submit">Send</button>

    </form>

    {% endif %}

</div>


<script>
    const messagesBox = document.getElementById("messages");

    function scrollToBottom() {
        messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    async function checkMessages() {
        try {
            const response = await fetch("/messages?time=" + Date.now());

            if (!response.ok) {
                return;
            }

            const messages = await response.json();

            const currentCount =
                messagesBox.querySelectorAll(".message").length;

            if (messages.length !== currentCount) {

                messagesBox.innerHTML = "";

                messages.forEach(function(msg) {

                    const messageDiv =
                        document.createElement("div");

                    messageDiv.className = "message";


                    const nameDiv =
                        document.createElement("div");

                    nameDiv.className = "name";

                    nameDiv.textContent = msg.name;


                    const textDiv =
                        document.createElement("div");

                    textDiv.className = "text";

                    textDiv.textContent = msg.message;


                    messageDiv.appendChild(nameDiv);
                    messageDiv.appendChild(textDiv);

                    messagesBox.appendChild(messageDiv);
                });

                scrollToBottom();
            }

        } catch (error) {
            console.log("Message check error:", error);
        }
    }

    scrollToBottom();

    setInterval(checkMessages, 1000);
</script>

</body>
</html>
